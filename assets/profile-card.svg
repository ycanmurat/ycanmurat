<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420">
      <stop stop-color="#090C14"/>
      <stop offset="0.5" stop-color="#101321"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="wave" x1="650" y1="0" x2="1140" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="50"/>
    </filter>

    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#252A3B" stroke-width="1" opacity="0.35"/>
    </pattern>

    <clipPath id="card">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">

    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)" opacity="0.6"/>

    <circle cx="980" cy="120" r="230" fill="url(#glow)" filter="url(#blur)">
      <animate
        attributeName="r"
        values="200;250;200"
        dur="8s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="580" cy="390" r="170" fill="#22D3EE" opacity="0.05" filter="url(#blur)"/>

    <!-- top line -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

    <!-- left identity -->

    <text
      x="64"
      y="72"
      fill="#6B7280"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
      letter-spacing="4">
      MURAT CAN YÖRÜSÜN / PROFILE SIGNAL
    </text>

    <text
      x="64"
      y="139"
      fill="#F8FAFC"
      font-family="Arial, Helvetica, sans-serif"
      font-size="44"
      font-weight="800">
      14 YEARS
    </text>

    <text
      x="64"
      y="174"
      fill="#22D3EE"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18"
      font-weight="600"
      letter-spacing="3">
      BUILDING FOR THE WEB
    </text>

    <line x1="64" y1="205" x2="485" y2="205" stroke="#2A3041"/>

    <text
      x="64"
      y="247"
      fill="#F8FAFC"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="700">
      Senior Frontend Engineer
    </text>

    <text
      x="64"
      y="280"
      fill="#A78BFA"
      font-family="Arial, Helvetica, sans-serif"
      font-size="20"
      font-weight="600">
      Creative Product Engineer
    </text>

    <text
      x="64"
      y="333"
      fill="#94A3B8"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      font-weight="500">
      REACT   •   TYPESCRIPT   •   THREE.JS   •   WEBGL   •   AI
    </text>

    <circle cx="69" cy="371" r="5" fill="#22D3EE">
      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="85"
      y="376"
      fill="#64748B"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="600"
      letter-spacing="2">
      ENGINEERING × INTERACTION × COMPUTATION
    </text>

    <!-- divider -->

    <line x1="555" y1="62" x2="555" y2="358" stroke="#2A3041"/>

    <!-- right panel -->

    <text
      x="615"
      y="72"
      fill="#6B7280"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="3">
      ACTIVITY / TRAJECTORY
    </text>

    <text
      x="615"
      y="115"
      fill="#F8FAFC"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18"
      font-weight="700">
      Product Engineering → Creative Systems → AI-native Interfaces
    </text>

    <!-- guide lines -->

    <line x1="615" y1="180" x2="1135" y2="180" stroke="#252A3B"/>
    <line x1="615" y1="230" x2="1135" y2="230" stroke="#252A3B"/>
    <line x1="615" y1="280" x2="1135" y2="280" stroke="#252A3B"/>

    <!-- glowing signal -->

    <path
      d="M615 275
         C650 270 670 250 700 258
         C735 268 748 205 785 214
         C820 224 835 245 865 235
         C900 223 910 177 945 187
         C980 197 987 245 1022 220
         C1055 196 1065 145 1090 155
         C1110 163 1120 188 1135 174"
      stroke="url(#wave)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
      filter="url(#lineGlow)"
      stroke-dasharray="900"
      stroke-dashoffset="900">

      <animate
        attributeName="stroke-dashoffset"
        from="900"
        to="0"
        dur="2.5s"
        fill="freeze"
      />

    </path>

    <!-- signal nodes -->

    <g fill="#F59E0B">

      <circle cx="700" cy="258" r="6"/>
      <circle cx="785" cy="214" r="6"/>
      <circle cx="865" cy="235" r="6"/>
      <circle cx="945" cy="187" r="6"/>
      <circle cx="1022" cy="220" r="6"/>
      <circle cx="1090" cy="155" r="7">

        <animate
          attributeName="r"
          values="6;10;6"
          dur="2s"
          repeatCount="indefinite"
        />

      </circle>

    </g>

    <text
      x="615"
      y="335"
      fill="#22D3EE"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="2">
      CURRENT VECTOR
    </text>

    <text
      x="615"
      y="366"
      fill="#CBD5E1"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      font-weight="600">
      WebGL  /  Generative UI  /  Realtime  /  AI Product Engineering
    </text>

  </g>

  <rect
    x="1"
    y="1"
    width="1198"
    height="418"
    rx="27"
    stroke="#242A3A"
    stroke-width="2"/>

</svg>
